<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevConf-A01</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Google fonts - (Inter and Arino) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header>
      <nav class="container">
        <!-- Logo -->
        <a href="#" class="logo-wrapper">
          <div class="logo">
            <i class="fa-solid fa-code"></i>
          </div>
          <div class="logo-txt">
            <span>DEVCONF</span>
            <span>2026</span>
          </div>
        </a>

        <!-- Menu items -->
        <div class="menu">
          <ul>
            <li><a href="#speakers">Speakers</a></li>
            <li><a href="#schedule">Schedule</a></li>
            <li><a href="#tracks">Tracks</a></li>
            <li><a href="#venue">Venue</a></li>
            <li><a href="#blog">Blog</a></li>
          </ul>
        </div>

        <!-- Register button -->
        <div>
          <button class="btn primary-btn">Register Now</button>
        </div>
      </nav>
    </header>
    <main>
      <section id="hero" class="hero">
        <!-- Overlay Div -->
        <div class="hero-overlay"></div>
        <div class="container">
          <div class="hero-wrapper">
            <h1 class="hero-heading">
              Code.
              <em>Connect.</em>
              Create
            </h1>
            <p>
              Join 4,000+ engineers, founders, and builders at the premier
              developer
              <br />
              conference of 2026. Three days of cutting-edge talks, hands-on
              workshops, <br />and meaningful connections.
            </p>
            <div class="hero-btn-wrapper">
              <button class="btn primary-btn">Register Now</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
